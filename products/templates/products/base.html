{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|title }}</title>

    <!-- Шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    {% block css %}{% endblock %}
</head>
<body>

    <!-- ========== ШАПКА ========== -->
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <div class="logo">
                    <i class="fas fa-gamepad"></i>
                    <span>Game<span>Store</span></span>
                </div>
                <nav class="nav">
                    <a href="{% url 'home' %}">Главная</a>
                    <a href="{% url 'products:home' %}">Каталог</a>
                    <a href="{% url 'products:library' %}">Библиотека</a>
                    <a href="{% url 'about' %}">О нас</a>
                </nav>
                <div class="header-actions">
                <div class="search">
                    <input type="text" placeholder="Поиск...">
                    <button><i class="fas fa-search"></i></button>
                </div>

                {% if user.is_authenticated %}
                    <a href="{% url 'users:profile' %}" class="btn-profile">
                        {{ user.username }}
                        <i class="fas fa-user-circle"></i>
                    </a>

                    <a href="{% url 'users:logout' %}" class="btn-login-header">
                        <i class="fas fa-sign-in-alt"></i><span>Выйти</span>
                    </a>

                    <a href="{% url 'products:basket' %}" class="nav-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Корзина</span>
                    </a>
                {% else %}
                    <a href="{% url 'users:login' %}" class="btn-login-header">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Войти</span>
                    </a>
                {% endif %}
                </div>
            </div>
        </div>
    </header>

    <!-- ========== КОНТЕНТ ========== -->
    {% block content %}{% endblock %}

    <!-- ========== ПОДВАЛ ========== -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">Game<span>Store</span></div>
                <p class="footer-copy">© 2026 GameStore. Все права защищены.</p>
                <div class="footer-social">
                    <a href="#"><i class="fab fa-vk"></i></a>
                    <a href="#"><i class="fab fa-telegram"></i></a>
                    <a href="#"><i class="fab fa-youtube"></i></a>
                    <a href="#"><i class="fab fa-discord"></i></a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
